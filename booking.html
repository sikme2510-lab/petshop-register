<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>จองคิว Pet Grooming</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Kanit', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { color: #667eea; font-size: 28px; margin-bottom: 10px; }
    .header p { color: #666; font-size: 14px; }
    .user-info {
      background: #f5f5f5; padding: 15px;
      border-radius: 10px; margin-bottom: 20px;
    }
    .user-info p { margin: 5px 0; color: #333; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; color: #333; font-weight: 600;
      margin-bottom: 8px; font-size: 14px;
    }
    .form-group input, .form-group select {
      width: 100%; padding: 12px 15px;
      border: 2px solid #e0e0e0; border-radius: 10px;
      font-size: 16px; transition: all 0.3s;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none; border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .service-options { display: grid; gap: 10px; }
    .service-option {
      display: flex; align-items: center;
      padding: 12px; border: 2px solid #e0e0e0;
      border-radius: 10px; cursor: pointer;
      transition: all 0.3s;
    }
    .service-option:hover { border-color: #667eea; background: #f8f9ff; }
    .service-option input[type="checkbox"] {
      width: 20px; height: 20px; margin-right: 10px;
    }
    .service-option label { flex: 1; cursor: pointer; font-weight: normal; margin: 0; }
    .service-price { color: #667eea; font-weight: 600; }
    .total-price {
      background: #667eea; color: white;
      padding: 15px; border-radius: 10px;
      text-align: center; margin: 20px 0;
      font-size: 20px; font-weight: 600;
    }
    .submit-btn {
      width: 100%; padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border: none; border-radius: 10px;
      font-size: 18px; font-weight: 600; cursor: pointer;
      transition: all 0.3s; margin-top: 10px;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    .submit-btn:disabled { background: #ccc; cursor: not-allowed; }
    .loading { display: none; text-align: center; padding: 20px; }
    .loading.active { display: block; }
    .success-message { display: none; text-align: center; padding: 30px; }
    .success-message.active { display: block; }
    .success-message h2 { color: #4CAF50; margin-bottom: 15px; }
    .icon { font-size: 60px; margin-bottom: 20px; }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>📅 จองคิว</h1>
      <p>Pet Grooming Shop</p>
    </div>

    <div class="user-info" id="userInfo">
      <p><strong>ลูกค้า:</strong> <span id="customerName">กำลังโหลด...</span></p>
      <p><strong>น้อง:</strong> <span id="petName">ไม่ระบุ</span></p>
    </div>

    <form id="bookingForm">
      <div class="form-group">
        <label>เลือกบริการ *</label>
        <div class="service-options">
          <div class="service-option">
            <input type="checkbox" id="service1" name="services" value="อาบน้ำ" data-price="119">
            <label for="service1">อาบน้ำ <span class="service-price">119 บาท</span></label>
          </div>
          <div class="service-option">
            <input type="checkbox" id="service2" name="services" value="ตัดขน" data-price="200">
            <label for="service2">ตัดขน <span class="service-price">200 บาท</span></label>
          </div>
          <div class="service-option">
            <input type="checkbox" id="service3" name="services" value="ตัดเล็บ" data-price="50">
            <label for="service3">ตัดเล็บ <span class="service-price">50 บาท</span></label>
          </div>
          <div class="service-option">
            <input type="checkbox" id="service4" name="services" value="เช็ดหู" data-price="30">
            <label for="service4">เช็ดหู <span class="service-price">30 บาท</span></label>
          </div>
          <div class="service-option">
            <input type="checkbox" id="service5" name="services" value="หยอดเห็บหมัด" data-price="100">
            <label for="service5">หยอดเห็บหมัด <span class="service-price">100 บาท</span></label>
          </div>
        </div>
      </div>

      <div class="total-price" id="totalPrice">ยอดรวม: 0 บาท</div>

      <div class="form-group">
        <label>เลือกวันที่ *</label>
        <input type="date" id="bookingDate" required min="">
      </div>

      <div class="form-group">
        <label>เลือกเวลา *</label>
        <select id="bookingTime" required>
          <option value="">-- เลือกเวลา --</option>
          <option value="09:00">09:00 น.</option>
          <option value="10:00">10:00 น.</option>
          <option value="11:00">11:00 น.</option>
          <option value="12:00">12:00 น.</option>
          <option value="13:00">13:00 น.</option>
          <option value="14:00">14:00 น.</option>
          <option value="15:00">15:00 น.</option>
          <option value="16:00">16:00 น.</option>
          <option value="17:00">17:00 น.</option>
        </select>
      </div>

      <button type="submit" class="submit-btn">ยืนยันการจอง</button>
    </form>

    <div class="loading" id="loading">
      <div class="icon">⏳</div>
      <h3>กำลังจองคิว...</h3>
    </div>

    <div class="success-message" id="successMessage">
      <div class="icon">✅</div>
      <h2>จองคิวสำเร็จ!</h2>
      <p id="bookingDetails"></p>
    </div>
  </div>

  <!-- ✅ JavaScript อยู่ใน <script> ก่อน </body> -->
  <script>
    const LIFF_ID = '2008313526-gxZrdbMx';
    const WEBHOOK_URL = 'https://hook.eu2.make.com/hb9yz1fe5b4ldte2zoy2kakrcrmq3z8o';

    let lineUserId = '';
    let displayName = '';

    // ตั้งค่าวันที่ขั้นต่ำ
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('bookingDate').min = today;

    // เริ่มต้น LIFF
    window.onload = function() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (liff.isLoggedIn()) {
            liff.getProfile().then(profile => {
              lineUserId = profile.userId;
              displayName = profile.displayName;
              document.getElementById('customerName').textContent = displayName;
            });
          } else {
            liff.login();
          }
        })
        .catch(err => {
          console.error('LIFF init failed:', err);
          alert('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง');
        });
    };

    // คำนวณยอดรวมอัตโนมัติ
    const serviceCheckboxes = document.querySelectorAll('input[name="services"]');
    const totalPriceEl = document.getElementById('totalPrice');
    serviceCheckboxes.forEach(cb => {
      cb.addEventListener('change', () => {
        let total = 0;
        serviceCheckboxes.forEach(x => { if (x.checked) total += parseInt(x.dataset.price); });
        totalPriceEl.textContent = `ยอดรวม: ${total} บาท`;
      });
    });

    // ส่งข้อมูลไป Make.com
    document.getElementById('bookingForm').addEventListener('submit', async e => {
      e.preventDefault();

      const selectedServices = Array.from(serviceCheckboxes)
        .filter(x => x.checked)
        .map(x => x.value);

      if (selectedServices.length === 0) {
        alert('กรุณาเลือกบริการอย่างน้อย 1 รายการ');
        return;
      }

      const bookingDate = document.getElementById('bookingDate').value;
      const bookingTime = document.getElementById('bookingTime').value;
      if (!bookingDate || !bookingTime) {
        alert('กรุณาเลือกวันที่และเวลา');
        return;
      }

      const totalPrice = totalPriceEl.textContent.replace('ยอดรวม: ', '').replace(' บาท', '');

      const data = {
        line_user_id: lineUserId,
        display_name: displayName,
        services: selectedServices.join(', '),
        booking_date: bookingDate,
        booking_time: bookingTime,
        total_price: totalPrice
      };

      document.getElementById('loading').classList.add('active');

      try {
        const res = await fetch(WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        document.getElementById('loading').classList.remove('active');

        if (res.ok) {
          document.getElementById('bookingForm').style.display = 'none';
          document.getElementById('successMessage').classList.add('active');
          document.getElementById('bookingDetails').textContent =
            `คุณเลือกบริการ: ${selectedServices.join(', ')} วันที่ ${bookingDate} เวลา ${bookingTime}`;

          // ส่งข้อความกลับไปที่ LINE
          if (liff.isInClient()) {
            liff.sendMessages([
              { type: 'text', text: 🎉 จองคิวสำเร็จ!\n${displayName}\nบริการ: ${selectedServices.join(', ')}\nวันที่ ${bookingDate}\nเวลา ${bookingTime} }
            ]);
          }
        } else {
          alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
        }

      } catch (err) {
        console.error(err);
        alert('ไม่สามารถเชื่อมต่อ Webhook ได้');
      }
    });
  </script>
</body>
</html>
